<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Horizon — event tracker</title>
<meta name="description" content="A simple place to keep track of the things you're going to.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0C10">

<!-- iOS home screen behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horizon">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app"></div>

<!-- Bottom nav (mobile) / side nav (desktop) -->
<nav class="nav" id="nav">
  <button class="nav-btn" data-route="home" aria-label="Home">
    <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 11.5 12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-btn nav-add" data-route="add" aria-label="Add event">
    <svg viewBox="0 0 24 24" class="nav-icon nav-icon-add"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
  </button>
  <button class="nav-btn" data-route="archive" aria-label="Archive">
    <svg viewBox="0 0 24 24" class="nav-icon"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 18V9" stroke-linecap="round"/><path d="M10 13h4" stroke-linecap="round"/></svg>
    <span>Archive</span>
  </button>
</nav>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // Check for a new version every time the app is opened or brought
      // back to the foreground — a home-screen app can otherwise sit on
      // an old service worker for weeks without ever re-checking.
      reg.update();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    }).catch(() => {});

    // Once a new service worker takes control, the new app.js/styles.css
    // are live but this tab is still running the old ones in memory.
    // Reload once to pick them up — unless the person is mid-way through
    // adding or editing an event, in which case wait until they navigate
    // away so an in-progress draft is never lost to a surprise refresh.
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      const onSafeRoute = () => !/^#\/(add|edit)/.test(location.hash);
      if (onSafeRoute()) {
        reloading = true;
        window.location.reload();
      } else {
        const retry = () => {
          if (onSafeRoute()) {
            window.removeEventListener('hashchange', retry);
            reloading = true;
            window.location.reload();
          }
        };
        window.addEventListener('hashchange', retry);
      }
    });
  });
}
</script>
</body>
</html>
